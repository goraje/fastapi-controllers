[project]
name = "fastapi-controllers"
dynamic = ["version"]
authors = [
    { name = "Jerzy Góra", email = "j.gora89@gmail.com" },
]
description = "Simple Controller implementation for FastAPI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["fastapi", "controller", "cbv", "routing"]
classifiers = [
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # Floor: lowest release passing tests/packaging minimum mode on 3.11–3.14.
    "fastapi>=0.124.0",
]

[project.urls]
Homepage = "https://github.com/goraje/fastapi-controllers"
Source = "https://github.com/goraje/fastapi-controllers"
Issues = "https://github.com/goraje/fastapi-controllers/issues"

[build-system]
requires = ["hatch-vcs>=0.5.0", "hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
]
# Exact versions: the pre-commit hooks and CI run these from uv.lock.
lint = [
    "basedpyright==1.40.2",
    "prek==0.5.5",
    "ruff==0.16.10",
    "ty==0.0.84",
    "typos==1.50.3",
]

[tool.uv]
default-groups = ["dev", "lint"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.md"]
lint.select = [
    "A",
    "ANN",
    "B",
    "C4",
    "C90",
    "E",
    "ERA",
    "F",
    "I",
    "PIE",
    "PT",
    "PYI",
    "SLF001",
    "TID251",
    "UP031",
    "W",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "recommended"
# Ignored .write()/.add() results are normal here; `_ = ...` on every one is noise.
reportUnusedCallResult = "none"
# Long help and error text is wrapped as adjacent string literals throughout.
reportImplicitStringConcatenation = "none"

[tool.pytest.ini_options]
addopts = "-n auto --strict-markers --strict-config"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.report]
fail_under = 90
