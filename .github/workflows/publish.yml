name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and attest wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Verify tag points to main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build wheel
        run: uv build --wheel

      - name: Verify distribution version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#v}"
          python - "$expected" <<'PY'
          import pathlib
          import sys

          expected = sys.argv[1]
          distributions = list(pathlib.Path("dist").glob("fastapi_controllers-*.whl"))
          if len(distributions) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel, found {len(distributions)}"
              )
          filename = distributions[0].name.removeprefix("fastapi_controllers-")
          version = filename.split("-", 1)[0]
          if version != expected:
              raise SystemExit(
                  f"Expected version {expected!r}, found {version!r}"
              )
          PY

      - name: Check wheel
        run: uvx twine check dist/*.whl

      - name: Attest wheel
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Upload wheel
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  checks:
    name: Validate release commit and wheel
    needs: build
    uses: ./.github/workflows/checks.yml
    with:
      wheel-artifact: wheel

  publish:
    name: Publish wheel to PyPI
    needs: [build, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/fastapi-controllers/
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v8.0.1
        with:
          name: wheel
          path: dist

      - name: Publish wheel
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
