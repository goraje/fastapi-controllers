name: compatibility checks

on:
  workflow_call:
    inputs:
      wheel-artifact:
        description: Existing wheel artifact to validate for this exact commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run the pre-commit hooks
        run: uv run --locked prek run --all-files --show-diff-on-failure

  ty:
    name: ty
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run ty check
        run: uv run --locked ty check

  basedpyright:
    name: basedpyright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run basedpyright
        run: uv run --locked basedpyright

  mypy:
    name: mypy ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install project and dev dependencies
        run: uv sync --locked

      - name: Run mypy --strict
        run: uv run mypy --strict src tests

  pytest:
    name: pytest ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [lint, ty, basedpyright, mypy]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install project and dev dependencies
        run: uv sync --locked

      - name: Run full applicable suite
        run: uv run pytest -v tests --cov=src/fastapi_controllers --cov-report=term

  wheel:
    name: Prepare wheel for isolated installation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - if: inputs.wheel-artifact == ''
        run: uv build --wheel
      - if: inputs.wheel-artifact == ''
        run: uvx twine check dist/*.whl
      - if: inputs.wheel-artifact == ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: checked-wheel
          path: dist/*.whl
          if-no-files-found: error

  installed-wheel:
    name: installed wheel ${{ matrix.os }}
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.wheel-artifact || 'checked-wheel' }}
          path: dist
      - name: Check all Python versions and dependency configurations
        run: uv run --no-project --python 3.14 python tests/packaging/check_matrix.py --wheel-dir dist
